<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Student Registation Form</h1>
  <form action="https://www.youtube.com/@radhe_radhe.4595">
    <fieldset>
      <legend>Student Information</legend>
      <table>
        <tr>
          <td><label for="Full Name">Full Name</label></td>
          <td><input type="text" name="full name" id="1" placeholder="Sagar" required></td>
        </tr>
        <tr>
          <td><label for="date of birth">Date Of Birth</label></td>
          <td><input type="date" name="dob" id="2" placeholder="24/01/2002" required></td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td><input type="email" name="email" id="5"   placeholder="sagarmaniro@gmail.com" required></td>
        </tr>
        <tr>
          <td><label for="nationality">Nationality</label></td>
          <td><input type="text" name="nationality" id="3" placeholder="india" required></td>
        </tr>
        <tr>
          <td><label for="Phone number">Phone Number</label></td>
          <td><input type="tel" name="phone number" id="4" placeholder="7894507951" required></td>
        </tr>
        <tr>
          <td><label for="hobby">Hobby</label></td>
          <td><input type="checkbox" name="hobby" value="dancing">dancing
            <input type="checkbox" name="hobby" value="signing">signing
            <input type="checkbox" name="hobby" value="travelling">travelling
            <input type="checkbox" name="hobby" value="others">Others
          </td>
        </tr>
        <tr>
          <td><label for="Gender">Gender</label></td>
          <td><input type="radio" name="Gender" value="male" required>Male
            <input type="radio" name="Gender" value="female" required>Female
            <input type="radio" name="Gender" value="Others" required>Others
          </td>
        </tr>
        <tr>
          <td><label for="address">Address</label></td>
          <td><textarea name="address" id="15" rows="5" cols="30" required></textarea></td>
        </tr>
      </table>
    </fieldset>
    <fieldset>
      <legend>Guardian Information</legend>
      <table>
        <tr>
          <td><label for="guardian name">Guardian Name</label></td>
          <td><input type="text" name="guardian name" id="6"  placeholder="sipu" required></td>
        </tr>
        <tr>
          <td><label for="relationship to student">Relationship to Student</label></td>
          <td><input type="text" name="relationship" id="7" placeholder="son" required></td>
        </tr>
        <tr>
          <td><label for="Phone number">Phone Number</label></td>
          <td><input type="tel" name="phone number" id="8"  placeholder="8018077145" required></td>
        </tr>
        <tr>
          <td><label for="alternate number">Alternate Phone Number</label></td>
          <td><input type="tel" name="alternate number"  id="9" placeholder="1236578942" required></td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td><input type="email" name="email" id="10"   placeholder="sagarmaniro@gmail.com" required></td>
        </tr> 
      </table>
    </fieldset>
    <fieldset>
      <legend>Education Information</legend>
      <table>
        <tr>
          <td><label for="Institution Name">Institute Name</label></td>
          <td><input type="text" name="Institution name" id="11" required></td>
        </tr>
        <tr>
          <td><label for="passing year">Passing Year</label></td>
          <td><select name="year" id="12" required>
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
          </select></td>
        </tr>
        <tr>
          <td><label for="Branch">Branch</label></td>
          <td>
            <select name="branch" id="14" required>
              <option value="chemistry">Chemistry</option>
              <option value="Physics">Physics</option>
              <option value="Math">Math</option>
              <option value="computer Science">Computer Science</option>
              <option value="biology">Biology</option>
              <option value="Botany">Botany</option>
            </select>
          </td>
        </tr>
      </table><br>
      <input type="submit">
    </fieldset>
  </form>
</body>

</html>
